<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Pipeline from a pull request through Apex, PMD, Flow and SA11y checks, a report, lead approval and auto-merge">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f8fd"/><stop offset="1" stop-color="#e3eefa"/></linearGradient>
    <linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#057642"/><stop offset="1" stop-color="#2fa35f"/></linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.2" fill="#b9c9e3" opacity=".55"/></pattern>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1c2b4d" flood-opacity=".13"/></filter>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5L9 5L1 8.5z" fill="#5f6f8f"/></marker>
    <marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1.5L9 5L1 8.5z" fill="#d98a00"/></marker>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#dots)"/>

  <g transform="translate(0,8)" font-family="Montserrat, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif">

    <!-- 01 PR raised -->
    <rect x="46" y="30" width="708" height="74" rx="22" fill="#fff" filter="url(#sh)"/>
    <circle cx="92" cy="67" r="26" fill="#dbe7fb"/>
    <g transform="translate(72.8,47.8) scale(1.6)" fill="none" stroke="#1952b3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7"/><path d="M6 9v12"/></g>
    <text x="134" y="62" font-size="20" font-weight="700" fill="#14213d">Developer raises a pull request</text>
    <text x="134" y="85" font-size="13.5" fill="#5b6478">The pipeline starts on its own for every PR</text>
    <text x="728" y="76" font-size="30" font-weight="300" fill="#c3cde0" text-anchor="end">01</text>

    <!-- connectors to the gates -->
    <g fill="none" stroke="#5f6f8f" stroke-width="2" stroke-linecap="round">
      <path d="M400 104V128"/>
      <path d="M121 128H679"/>
      <path d="M121 128V152" marker-end="url(#ar)"/>
      <path d="M307 128V152" marker-end="url(#ar)"/>
      <path d="M493 128V152" marker-end="url(#ar)"/>
      <path d="M679 128V152" marker-end="url(#ar)"/>
    </g>
    <rect x="262" y="116" width="276" height="24" rx="12" fill="#14213d"/>
    <text x="400" y="132.2" font-size="10.5" font-weight="700" letter-spacing="1.6" fill="#fff" text-anchor="middle">02 · CHECKS RUN AUTOMATICALLY</text>

    <!-- gate: Apex -->
    <rect x="46" y="156" width="150" height="140" rx="20" fill="#fff" filter="url(#sh)"/>
    <circle cx="121" cy="196" r="26" fill="#dbe7fb"/>
    <g transform="translate(103,178) scale(1.5)" fill="none" stroke="#1952b3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m18 16 4-4-4-4"/><path d="m6 8-4 4 4 4"/><path d="m14.5 4-5 16"/></g>
    <text x="121" y="248" font-size="16" font-weight="700" fill="#14213d" text-anchor="middle">Apex checks</text>
    <text x="121" y="269" font-size="12" fill="#5b6478" text-anchor="middle">Scan the Apex code</text>
    <circle cx="174" cy="178" r="10" fill="#2fa35f"/><path d="M169.500 178.200l3 3 5-5.600" fill="none" stroke="#fff" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- gate: PMD -->
    <rect x="232" y="156" width="150" height="140" rx="20" fill="#fff" filter="url(#sh)"/>
    <circle cx="307" cy="196" r="26" fill="#e8defb"/>
    <g transform="translate(289,178) scale(1.5)" fill="none" stroke="#6a38d0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="m9 14 2 2 4-4"/></g>
    <text x="307" y="248" font-size="16" font-weight="700" fill="#14213d" text-anchor="middle">PMD checks</text>
    <text x="307" y="269" font-size="12" fill="#5b6478" text-anchor="middle">Static analysis rules</text>
    <circle cx="360" cy="178" r="10" fill="#2fa35f"/><path d="M355.500 178.200l3 3 5-5.600" fill="none" stroke="#fff" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- gate: Flow -->
    <rect x="418" y="156" width="150" height="140" rx="20" fill="#fff" filter="url(#sh)"/>
    <circle cx="493" cy="196" r="26" fill="#d4f1ea"/>
    <g transform="translate(475,178) scale(1.5)" fill="none" stroke="#0f8f7a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="8" height="8" rx="2"/><path d="M7 11v4a2 2 0 0 0 2 2h4"/><rect x="13" y="13" width="8" height="8" rx="2"/></g>
    <text x="493" y="248" font-size="16" font-weight="700" fill="#14213d" text-anchor="middle">Flow tests</text>
    <text x="493" y="269" font-size="12" fill="#5b6478" text-anchor="middle">Run the Flow test cases</text>
    <circle cx="546" cy="178" r="10" fill="#2fa35f"/><path d="M541.500 178.200l3 3 5-5.600" fill="none" stroke="#fff" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- gate: SA11y -->
    <rect x="604" y="156" width="150" height="140" rx="20" fill="#fff" filter="url(#sh)"/>
    <circle cx="679" cy="196" r="26" fill="#fdecc8"/>
    <g transform="translate(661,178) scale(1.5)" fill="none" stroke="#b86e00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="4" r="1"/><path d="m18 19 1-7-6 1"/><path d="m5 8 3-3 5.500 3-2.360 3.500"/><path d="M4.240 14.500a5 5 0 0 0 6.880 6"/><path d="M13.760 17.500a5 5 0 0 0-6.880-6"/></g>
    <text x="679" y="248" font-size="16" font-weight="700" fill="#14213d" text-anchor="middle">SA11y checks</text>
    <text x="679" y="269" font-size="12" fill="#5b6478" text-anchor="middle">Accessibility scan</text>
    <circle cx="732" cy="178" r="10" fill="#2fa35f"/><path d="M727.500 178.200l3 3 5-5.600" fill="none" stroke="#fff" stroke-width="2.200" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- connectors to the report -->
    <g fill="none" stroke="#5f6f8f" stroke-width="2" stroke-linecap="round">
      <path d="M121 296V322"/><path d="M307 296V322"/><path d="M493 296V322"/><path d="M679 296V322"/>
      <path d="M121 322H679"/>
      <path d="M400 322V342" marker-end="url(#ar)"/>
    </g>

    <!-- 03 report -->
    <rect x="46" y="346" width="708" height="76" rx="22" fill="#fff" filter="url(#sh)"/>
    <circle cx="92" cy="384" r="26" fill="#e6e9f0"/>
    <g transform="translate(74,366) scale(1.5)" fill="none" stroke="#44576e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></g>
    <text x="134" y="379" font-size="20" font-weight="700" fill="#14213d">A report is generated</text>
    <text x="134" y="402" font-size="13.5" fill="#5b6478">Every finding in one place, so issues are fixed before review</text>
    <text x="728" y="393" font-size="30" font-weight="300" fill="#c3cde0" text-anchor="end">03</text>

    <!-- fix loop back to the PR -->
    <path d="M754 384H778V67H759" fill="none" stroke="#d98a00" stroke-width="2.200" stroke-dasharray="6 6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#ar2)"/>
    <text transform="translate(790,226) rotate(90)" font-size="10.500" font-weight="700" letter-spacing="1.500" fill="#b86e00" text-anchor="middle">FIX AND PUSH AGAIN</text>

    <!-- 04 approval -->
    <path d="M211 422V454" fill="none" stroke="#5f6f8f" stroke-width="2" stroke-linecap="round" marker-end="url(#ar)"/>
    <rect x="46" y="458" width="330" height="96" rx="22" fill="#fff" filter="url(#sh)"/>
    <circle cx="94" cy="506" r="26" fill="#d9f2cf"/>
    <g transform="translate(76,488) scale(1.5)" fill="none" stroke="#2d7a1b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m16 11 2 2 4-4"/><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></g>
    <text x="136" y="501" font-size="17" font-weight="700" fill="#14213d">Lead approves the PR</text>
    <text x="136" y="523" font-size="12.500" fill="#5b6478">After reviewing the report</text>
    <text x="358" y="490" font-size="22" font-weight="300" fill="#c3cde0" text-anchor="end">04</text>

    <!-- approval to merge -->
    <path d="M376 506H420" fill="none" stroke="#5f6f8f" stroke-width="2" stroke-linecap="round" marker-end="url(#ar)"/>

    <!-- 05 merge -->
    <rect x="424" y="458" width="330" height="96" rx="22" fill="url(#mg)" filter="url(#sh)"/>
    <circle cx="472" cy="506" r="26" fill="#fff" fill-opacity=".22"/>
    <g transform="translate(454,488) scale(1.5)" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/></g>
    <text x="514" y="501" font-size="19" font-weight="700" fill="#fff">Auto-merged</text>
    <text x="514" y="523" font-size="12.500" fill="#fff" fill-opacity=".88">Into the target branch</text>
    <text x="736" y="490" font-size="22" font-weight="300" fill="#fff" fill-opacity=".5" text-anchor="end">05</text>
  </g>
</svg>
