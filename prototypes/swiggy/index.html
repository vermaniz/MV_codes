<style>

*{box-sizing:border-box}
html,body{margin:0}
body{font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:#fff;-webkit-font-smoothing:antialiased;font-size:16px}

.hd{max-width:1280px;margin:0 auto;height:80px;display:flex;align-items:center;gap:24px;padding:0 20px}
.lgo{display:flex;align-items:center;gap:6px;color:var(--or);font-weight:800;font-size:28px;letter-spacing:-1px}
.lgo i{font-style:normal;width:38px;height:38px;border-radius:12px 12px 12px 4px;background:var(--or);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;letter-spacing:0}
.loc{font-size:14px;color:var(--t2);display:flex;gap:8px;align-items:center;cursor:pointer;max-width:170px;white-space:nowrap;overflow:hidden}.loc span{overflow:hidden;text-overflow:ellipsis}
.loc b{color:var(--ink);border-bottom:2px solid var(--ink);padding-bottom:1px}
.nav{margin-left:auto;display:flex;gap:24px;align-items:center;white-space:nowrap}
.nav a,.nav button{display:flex;align-items:center;gap:9px;font-weight:500;color:#3d4152;font-size:16px;background:none;border:0;position:relative}
.nav a:hover,.nav button:hover{color:var(--or)}
.nav .on{color:var(--or)}
.nav .cnt{position:absolute;left:8px;top:-2px;font-size:11px;font-weight:700;color:var(--gr);width:100%;text-align:center}
.new{background:var(--gr);color:#fff;border-radius:4px;font-size:10px;font-weight:700;padding:1px 5px;letter-spacing:.04em}
.wrap{max-width:1200px;margin:0 auto;padding:24px 20px 120px}
h2.t{font-size:24px;font-weight:800;margin:24px 0 16px;letter-spacing:-.4px}
hr{border:0;border-top:1px solid var(--line);margin:28px 0 0}
/* budget banner */
.bb{border:1px solid var(--line);border-radius:16px;padding:16px 22px;display:flex;gap:28px;align-items:center;background:linear-gradient(90deg,#fff7ef,#fff);cursor:pointer}
.bb:hover{box-shadow:0 4px 18px rgba(40,44,63,.08)}
.bb .l{min-width:210px} .bb .l small{display:block;color:var(--t2);font-size:13px}
.bb .l b{font-size:22px}
.bbar{flex:1}
.pb{height:12px;border-radius:8px;background:#ececf0;overflow:hidden;display:flex}
.pb .s{background:var(--gr)} .pb .s.amber{background:var(--amb)} .pb .s.red{background:var(--red)}
.pb .a{background:repeating-linear-gradient(45deg,var(--or),var(--or) 4px,#ffb26b 4px,#ffb26b 8px)}
.bbar .sub{display:flex;justify-content:space-between;font-size:13px;color:var(--t2);margin-top:6px}
.link{color:var(--or);font-weight:700;font-size:14px}
.cta{border:2px dashed #f2c39a;background:#fffaf5}
/* cuisines */
.cu{display:flex;gap:22px;overflow:hidden}
.cu div{text-align:center;font-weight:600;color:var(--t2);font-size:14px}
.cu span{display:flex;width:112px;height:112px;border-radius:50%;background:#fff3e6;align-items:center;justify-content:center;font-size:54px;margin-bottom:6px}
/* chips */
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid #d9d9dc;border-radius:22px;padding:9px 16px;font-size:14px;color:#3d4152;background:#fff;display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 4px rgba(0,0,0,.05)}
.chip.fr{border-color:var(--or);background:#fff4ea;color:var(--or-d);font-weight:700}
.chip.fr b{font-weight:800}
.cnt-line{color:var(--t2);font-size:14px;margin:4px 0 16px;display:flex;gap:10px;align-items:center}
/* restaurant grid */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:32px 28px}
.rc{cursor:pointer;transition:transform .15s}.rc:hover{transform:scale(.97)}
.rc .im{height:182px;border-radius:16px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:76px}
.rc .im:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(27,30,36,0) 45%,rgba(27,30,36,.85))}
.rc .of{position:absolute;left:12px;bottom:8px;z-index:2;color:#fff;font-size:19px;font-weight:800;letter-spacing:-.4px;text-transform:uppercase}
.rc h3{margin:12px 0 2px;font-size:18px;font-weight:700;letter-spacing:-.3px}
.rc .rt{font-weight:700;display:flex;gap:6px;align-items:center;font-size:16px}
.star{width:20px;height:20px;border-radius:50%;background:var(--gr-d);display:inline-flex;align-items:center;justify-content:center}
.star svg{width:11px;height:11px;fill:#fff;stroke:none}
.rc .cs{color:var(--t2);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt{display:inline-block;margin-top:6px;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:700}
.mt.g{background:#e8f6e3;color:var(--gr-d)} .mt.a{background:#fff2d9;color:#9a6200}
/* restaurant page */
.rp{max-width:800px;margin:0 auto;padding:24px 20px 140px}
.crumb{font-size:12px;color:var(--t3);margin-bottom:18px}.crumb a:hover{color:var(--ink)}
.rp h1{font-size:24px;margin:0 0 14px;font-weight:800;letter-spacing:-.5px}
.box{border:1px solid var(--line);border-radius:20px;padding:14px 18px;background:linear-gradient(180deg,#fff,#f6f6f8);box-shadow:0 6px 16px rgba(40,44,63,.06)}
.box .r1{font-weight:800;display:flex;gap:6px;align-items:center;font-size:16px}
.box .r2{color:var(--t2);font-size:14px;margin-top:6px}
.fr-strip{margin:18px 0;border-radius:14px;border:1px solid #f6d3b2;background:#fff7ee;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.fr-strip .tx{flex:1;min-width:240px;font-size:14px}.fr-strip b{font-weight:800}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--t2);cursor:pointer;user-select:none}
.sw i{width:34px;height:20px;border-radius:12px;background:#c7c7cc;position:relative;transition:.15s}
.sw i:after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.sw.on i{background:var(--gr)} .sw.on i:after{left:16px}
.menu-h{font-size:18px;font-weight:800;margin:22px 0 4px}
.mi{display:flex;justify-content:space-between;gap:16px;padding:20px 0;border-bottom:1px solid var(--line)}
.mi.bad .tx{opacity:.62}
.vi{width:16px;height:16px;border:1.5px solid var(--gr-d);display:inline-flex;align-items:center;justify-content:center;border-radius:3px;margin-bottom:6px}
.vi:after{content:"";width:8px;height:8px;border-radius:50%;background:var(--gr-d)}
.vi.nv{border-color:#b9341f}.vi.nv:after{background:#b9341f}
.vi.eg{border-color:#c68a00}.vi.eg:after{background:#c68a00}
.mi .nm{font-size:16px;font-weight:600;color:#3e4152}
.mi .pr{font-size:14px;font-weight:600;margin:2px 0 8px}
.mi .ds{font-size:14px;color:var(--t2);line-height:1.4;max-width:520px}
.bd{display:inline-flex;align-items:center;gap:5px;border-radius:6px;padding:3px 8px;font-size:12px;font-weight:700;margin-top:8px}
.bd.ok{background:#e8f6e3;color:var(--gr-d)} .bd.mod{background:#e4effb;color:#1c5fa8} .bd.bad{background:#fde8e4;color:#b9341f} .bd.unk{background:#eee;color:#666}
.mi .pic{position:relative;width:118px;flex:none;text-align:center}
.mi .pic .ph{width:118px;height:96px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:48px;background:#fff1e3}
.add{position:absolute;left:11px;bottom:-16px;width:96px;height:36px;border-radius:8px;border:1px solid #d4d5d9;background:#fff;color:var(--gr-d);font-weight:800;font-size:15px;box-shadow:0 3px 8px rgba(40,44,63,.12);display:flex;align-items:center;justify-content:space-between;padding:0}

.add.single{justify-content:center}
.add span{width:30px;text-align:center;font-size:18px}

/* cart */
.cart{display:grid;grid-template-columns:1fr 400px;gap:28px;max-width:1100px;margin:0 auto;padding:28px 20px 100px;align-items:start}
.card{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:16px;background:#fff}
.card h3{margin:0 0 12px;font-size:18px;font-weight:800}
.ln{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}
.ln:first-of-type{border-top:0}
.ln .n{flex:1;font-size:15px;font-weight:600}.ln .n i{display:block;font-style:normal;color:var(--t2);font-weight:400;font-size:13px;margin-top:2px}
.stp{display:flex;border:1px solid #d4d5d9;border-radius:6px;overflow:hidden;color:var(--gr-d);font-weight:800}
.stp button{width:30px;height:30px;border:0;background:#fff;color:var(--gr-d);font-size:18px;font-weight:700}
.stp button:hover{background:#f0f0f5}.stp span{width:30px;text-align:center;line-height:30px;font-size:14px}
.bill div{display:flex;justify-content:space-between;font-size:14px;color:#3e4152;padding:5px 0}
.bill .tot{border-top:2px solid var(--ink);margin-top:8px;padding-top:12px;font-weight:800;font-size:16px;color:var(--ink)}
.pay{width:100%;background:var(--gr);border:0;color:#fff;font-weight:800;font-size:16px;padding:16px;border-radius:6px;letter-spacing:.02em;margin-top:6px}

.bi{border-radius:12px;padding:16px 18px;margin-bottom:16px;border:1px solid var(--line)}
.bi.amber{background:#fff8e8;border-color:#f5d99a}.bi.red{background:#fdecea;border-color:#f3b5ab}.bi.green{background:#f1faee;border-color:#cde8c4}
.bi h4{margin:0 0 8px;font-size:15px;font-weight:800;display:flex;justify-content:space-between;align-items:center}
.bi p{margin:8px 0 0;font-size:13.5px;color:#3e4152;line-height:1.4}

/* budget page */
.bp{max-width:1000px;margin:0 auto;padding:28px 20px 100px}
.bp h1{font-size:28px;margin:0 0 4px;font-weight:800;letter-spacing:-.6px}
.k3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:16px 0}
.kp{border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.kp small{color:var(--t2);font-size:13px;display:block}.kp b{font-size:26px;font-weight:800;letter-spacing:-.5px}.kp i{font-style:normal;font-size:13px;color:var(--t2);display:block;margin-top:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.wk{display:flex;align-items:flex-end;gap:14px;height:150px;padding:8px 4px 0}
.wk div{flex:1;text-align:center;font-size:12px;color:var(--t2)}
.wk span{display:block;background:var(--or);border-radius:6px 6px 0 0;margin-bottom:4px;min-height:3px}
.ord{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.ord:first-child{border-top:0}.ord small{display:block;color:var(--t2)}

#mroot{position:fixed;inset:0;background:rgba(40,44,63,.55);z-index:100;display:none;align-items:center;justify-content:center;overflow:auto;padding:24px}
#mroot.on{display:flex}
.modal{background:#fff;border-radius:16px;width:min(520px,96vw);box-shadow:0 20px 50px rgba(0,0,0,.35);max-height:92vh;overflow:auto}
.mh{display:flex;align-items:center;padding:18px 22px 6px}.mh h2{margin:0;flex:1;font-size:22px;font-weight:800;letter-spacing:-.4px}
.mx{background:none;border:0;width:36px;height:36px;border-radius:50%;font-size:20px;color:var(--t2)}.mx:hover{background:#f1f1f6}
.mb{padding:6px 22px 12px}.mf{padding:12px 22px 20px;display:flex;gap:10px}
.mb h5{margin:16px 0 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--t2);font-weight:800}
.pillrow{display:flex;gap:8px;flex-wrap:wrap}
.pill{border:1.5px solid #d4d5d9;background:#fff;border-radius:24px;padding:8px 16px;font-weight:700;font-size:14px;color:#3e4152}
.pill:hover{border-color:var(--or)}
.pill.on{border-color:var(--or);background:#fff4ea;color:var(--or-d)}
.pill.bad.on{border-color:var(--red);background:#fdecea;color:#b9341f}
.btn{border:0;border-radius:8px;padding:13px 20px;font-weight:800;font-size:15px;flex:1;letter-spacing:.02em}
.btn.p{background:var(--or);color:#fff}.btn.p:hover{background:var(--or-d)}
.btn.g{background:#fff;color:var(--or);border:2px solid var(--or)}
.btn.gr{background:var(--gr);color:#fff}
.fine{font-size:12.5px;color:var(--t2);line-height:1.4;margin-top:14px;background:#f7f7f9;border-radius:8px;padding:9px 12px}
.fld input,.fld select{width:100%;border:1.5px solid #d4d5d9;border-radius:8px;padding:12px 14px;font-size:18px;font-weight:700;color:var(--ink)}
.fld input:focus,.fld select:focus{outline:0;border-color:var(--or)}
.fld label{display:block;font-size:13px;color:var(--t2);font-weight:700;margin-bottom:6px}
.err{color:var(--red);font-size:13px;margin-top:6px;font-weight:600}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:#282c3f;color:#fff;border-radius:10px;padding:13px 18px;z-index:200;display:none;gap:18px;align-items:center;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
#toast.on{display:flex}#toast button{background:none;border:0;color:#ffb26b;font-weight:800;font-size:14px}
#demo{position:fixed;right:12px;bottom:10px;background:#282c3f;color:#fff;border-radius:16px;font-size:11px;padding:5px 12px;z-index:60;opacity:.92}
#demo a{color:#ffb26b;margin-left:8px;cursor:pointer}
@media (max-width:980px){.grid{grid-template-columns:repeat(2,1fr)}.cart,.two,.k3{grid-template-columns:1fr}.nav{gap:14px}.nav .lb{display:none}.bb{flex-wrap:wrap}}
</style>

function evalItem(it){
 const R=S.rules;if(!R.on)return {s:'ok',why:[]};
 if(it.unk)return {s:'unk',why:[]};
 const why=[],rank={vegan:0,veg:1,egg:2,nonveg:3},max={vegan:0,veg:1,jain:1,egg:2,any:3}[R.diet];
 if(rank[it.diet]>max)why.push({k:'diet',t:it.diet==='nonveg'?'Non-veg':it.diet==='egg'?'Egg':'Dairy'});
 const ex=new Set(R.excl);if(R.diet==='jain'){ex.add('onion');ex.add('garlic');ex.add('root')}
 it.has.forEach(h=>{if(ex.has(h))why.push({k:h,t:LBL[h]})});
 if(!why.length)return {s:'ok',why};
 const om=it.omit||[];
 if(why.every(w=>om.includes(w.k)))return {s:'mod',why,note:'No '+why.map(w=>w.t.toLowerCase()).join(', ')};
 return {s:'bad',why};
}
function restStats(r){const e=r.items.map(evalItem);return {n:r.items.length,match:e.filter(x=>x.s==='ok'||x.s==='mod').length,unk:e.filter(x=>x.s==='unk').length}}
const MINMATCH=3;
const rulesText=()=>{const R=S.rules;if(!R.on)return 'Off';const p=[DLBL[R.diet]];R.excl.forEach(x=>p.push('No '+LBL[x].toLowerCase()));return p.join(' · ')};

function monthOrders(){const n=new Date();return S.orders.filter(o=>{const d=new Date(o.at);return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()})}
const spent=()=>monthOrders().reduce((a,o)=>a+o.t,0);
function bstate(add=0){
 const B=S.budget&&S.budget.amount,sp=spent();if(!B)return {none:true,sp};
 const after=sp+add,pa=after/B*100,thr=S.budget.thr;
 return {B,sp,add,after,p:sp/B*100,pa,level:pa>100?'red':pa>=thr?'amber':'green'};
}
function pbar(b){const w1=Math.min(100,b.p),w2=Math.max(0,Math.min(100-w1,b.pa-b.p));return `<div class="pb"><div class="s ${b.p>100?'red':b.p>=S.budget.thr?'amber':''}" style="width:${w1}%"></div>${b.add?`<div class="a" style="width:${w2}%"></div>`:''}</div>`}

function billFor(){
 const L=S.cart.lines,item=Object.keys(L).reduce((a,id)=>a+itemById(id).it.price*L[id].q,0);
 if(!item)return {item:0,del:0,plat:0,gst:0,total:0};
 const del=39,plat=6,gst=Math.round(item*.05+12);return {item,del,plat,gst,total:item+del+plat+gst};
}

 <div class="k3"><div class="kp"><small>Daily average</small><b>${inr(b.sp/d)}</b><i>so far this month</i></div>
 <div class="kp"><small>Projected by month end</small><b style="color:${proj>b.B?'var(--red)':'var(--gr-d)'}">${inr(proj)}</b><i>${proj>b.B?inr(proj-b.B)+' over your budget at this pace':'within your budget at this pace'}</i></div>
 <div class="kp"><small>Safe to spend per day</small><b>${inr(Math.max(0,b.B-b.sp)/Math.max(1,dm-d+1))}</b><i>for the remaining ${dm-d+1} days</i></div></div>
 <div class="two"><div class="card"><h3>Spend by week</h3><div class="wk">${wk.map((v,i)=>`<div><span style="height:${v/mx*110}px"></span>${v?inr(v):'–'}<br>W${i+1}</div>`).join('')}</div></div>
 <div class="card"><h3>Top restaurants</h3>${top.map(([id,v])=>`<div class="ord"><span>${rest(id).name}</span><b>${inr(v)}</b></div>`).join('')||'<div style="color:var(--t2)">No orders yet</div>'}</div></div>
 <div class="card"><h3>Orders this month <span style="color:var(--t2);font-weight:500;font-size:14px">(${os.length})</span></h3>${os.map(o=>`<div class="ord"><span>${rest(o.r).name}<small>${new Date(o.at).toLocaleDateString('en-IN',{day:'numeric',month:'short'})}</small></span><b>${inr(o.t)}</b></div>`).join('')}</div>
 <div class="card" style="display:flex;justify-content:space-between;align-items:center"><span>Checkout heads-up <span style="color:var(--t2);font-size:14px">at ${S.budget.thr}% of budget</span></span><span class="sw ${S.budget.nudge?'on':''}" data-a="togglenudge"><i></i>${S.budget.nudge?'On':'Off'}</span></div>`}
 </div>`;
}

/* ================= MODALS ================= */
function closeModal(){modal=null;$('mroot').classList.remove('on');$('mroot').innerHTML='';header()}
function openModal(m){modal=m;renderModal();header()}
const shell=(t,b,f)=>`<div class="modal" role="dialog" aria-label="${esc(t)}"><div class="mh"><h2>${t}</h2><button class="mx" data-a="close" aria-label="Close">✕</button></div><div class="mb">${b}</div><div class="mf">${f}</div></div>`;
function renderModal(){
 if(!modal)return;const m=modal;let h='';
 if(m.t==='rules'){const R=m.d;
  h=shell('My Food Rules',`<div style="display:flex;justify-content:space-between;align-items:center"><span style="color:var(--t2);font-size:14px">Filter restaurants and flag dishes automatically</span><span class="sw ${R.on?'on':''}" data-a="r_on"><i></i>${R.on?'On':'Off'}</span></div>
  <h5>Diet</h5><div class="pillrow">${DIETS.map(([k,l])=>`<button class="pill ${R.diet===k?'on':''}" data-a="r_diet" data-k="${k}">${l}</button>`).join('')}</div>
  <h5>Also avoid</h5><div class="pillrow">${AVOID.map(k=>`<button class="pill bad ${R.excl.includes(k)?'on':''}" data-a="r_ex" data-k="${k}">${LBL[k]}</button>`).join('')}</div>
  <h5>Restaurants with fewer than ${MINMATCH} suitable dishes</h5><div class="pillrow"><button class="pill ${R.mode==='hide'?'on':''}" data-a="r_mode" data-k="hide">Hide them</button><button class="pill ${R.mode==='flag'?'on':''}" data-a="r_mode" data-k="flag">Show with a flag</button></div>
  <div class="fine">Matches are based on ingredients declared by restaurants and may be incomplete. For severe allergies, always confirm with the restaurant. Dishes with no information are never marked as a match.</div>`,
  `<button class="btn g" data-a="close">CANCEL</button><button class="btn p" data-a="r_save">SAVE RULES</button>`);
 }else if(m.t==='budget'){
  h=shell('Monthly food budget',`<div class="fld"><label>Amount for ${monthName()} (₹)</label><input id="ba" inputmode="numeric" value="${m.v??(S.budget?S.budget.amount:'')}" placeholder="e.g. 6000"><div class="err">${m.err||''}</div></div>
  <h5>Checkout heads-up</h5><div class="fld"><label>Warn me when an order takes me past</label><select id="bt">${[70,80,90].map(n=>`<option value="${n}" ${((S.budget&&S.budget.thr)||80)===n?'selected':''}>${n}% of my budget</option>`).join('')}</select></div>
  <div class="fine">Your budget is private to you and resets on the 1st of every month. It never blocks an order: you can always place it anyway.</div>`,
  `${S.budget?`<button class="btn g" data-a="b_remove">REMOVE</button>`:''}<button class="btn p" data-a="b_save">SAVE BUDGET</button>`);
 }else if(m.t==='conf'){const {it}=itemById(m.id),e=evalItem(it);
  h=shell('This dish may not suit you',`<p style="margin:6px 0 0;line-height:1.5"><b>${it.name}</b> contains <b style="color:#b9341f">${e.why.map(w=>w.t.toLowerCase()).join(', ')}</b>, which doesn't match your Food Rules (${esc(rulesText())}).</p><div class="fine">Ingredient information is declared by the restaurant.</div>`,
  `<button class="btn g" data-a="close">GO BACK</button><button class="btn p" data-a="add_force" data-id="${m.id}">ADD ANYWAY</button>`);
 }else if(m.t==='replace'){
  h=shell('Replace cart items?',`<p style="margin:6px 0 0;line-height:1.5">Your cart has items from <b>${rest(S.cart.r).name}</b>. Do you want to discard them and add <b>${itemById(m.id).it.name}</b> from ${itemById(m.id).r.name}?</p>`,
  `<button class="btn g" data-a="close">NO</button><button class="btn p" data-a="replace_ok" data-id="${m.id}">YES, START AFRESH</button>`);
 }else if(m.t==='over'){const bs=bstate(billFor().total);
  h=shell('This order is over your budget',`<p style="margin:6px 0 10px;line-height:1.5">With this order you will have spent <b>${inr(bs.after)}</b> of your <b>${inr(bs.B)}</b> ${monthName()} budget, <b style="color:#b9341f">${inr(bs.after-bs.B)} over</b>.</p>${pbar(bs)}<div class="fine">You can still place it. Nothing is blocked.</div>`,
  `<button class="btn g" data-a="close">REVIEW CART</button><button class="btn gr" data-a="place">PLACE ORDER ANYWAY</button>`);
 }
 const r=$('mroot');r.innerHTML=h;r.classList.add('on');
}

/* ================= TOAST ================= */
let tt;function toast(msg,act,fn){const t=$('toast');t.innerHTML=`<span>${msg}</span>${act?`<button id="tact">${act}</button>`:''}`;t.classList.add('on');if(act)$('tact').onclick=()=>{t.classList.remove('on');fn()};clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),5500)}

/* ================= ACTIONS ================= */
function addLine(id,force){
 const {r,it}=itemById(id),e=evalItem(it);
 if(S.cart.r&&S.cart.r!==r.id&&Object.keys(S.cart.lines).length){openModal({t:'replace',id});return}
 if(e.s==='bad'&&!force){openModal({t:'conf',id});return}
 S.cart.r=r.id;S.cart.lines[id]={q:1,note:e.s==='mod'?e.note:''};save();render()
}
function place(){
 const b=billFor(),r=S.cart.r;S.orders.push({id:'o'+Date.now(),r,t:b.total,at:new Date().toISOString()});
 S.cart={r:null,lines:{}};save();closeModal();go('home');render();
 const bs=bstate();toast(`Order placed · arriving in ${rest(r).eta} mins`+(bs.none?'':` · ${Math.round(bs.p)}% of budget used`),'View budget',()=>go('budget'));
}
const A={
 rules(){openModal({t:'rules',d:JSON.parse(JSON.stringify(S.rules))})},
 r_on(){modal.d.on=!modal.d.on;renderModal()},
 r_diet(e){modal.d.diet=e.k;renderModal()},
 r_ex(e){const a=modal.d.excl,i=a.indexOf(e.k);i<0?a.push(e.k):a.splice(i,1);renderModal()},
 r_mode(e){modal.d.mode=e.k;renderModal()},
 r_save(){S.rules=modal.d;save();closeModal();render();toast('Food Rules saved: '+rulesText())},
 showall(){S.rules.mode='flag';save();render()},hidemode(){S.rules.mode='hide';save();render()},
 only(){view.only=!view.only;render()},
 add(e){addLine(e.id)},add_force(e){closeModal();addLine(e.id,true)},
 replace_ok(e){S.cart={r:null,lines:{}};closeModal();addLine(e.id)},
 inc(e){S.cart.lines[e.id].q++;save();render()},
 dec(e){const l=S.cart.lines[e.id];l.q--;if(l.q<=0){delete S.cart.lines[e.id];if(!Object.keys(S.cart.lines).length)S.cart.r=null}save();render()},
 gocart(){go('cart')},gobudget(){go('budget')},
 budget(){openModal({t:'budget'})},
 b_save(){const v=$('ba').value.trim(),n=Number(v);
  if(!/^\d+$/.test(v)||n<500||n>100000){modal.err='Enter a whole amount between ₹500 and ₹1,00,000.';modal.v=v;renderModal();return}
  S.budget={amount:n,nudge:S.budget?S.budget.nudge:true,thr:+$('bt').value};save();closeModal();render();toast('Budget set to '+inr(n))},
 b_remove(){S.budget=null;save();closeModal();render();toast('Budget removed')},
 togglenudge(){S.budget.nudge=!S.budget.nudge;save();render()},
 pay(){const b=billFor(),bs=bstate(b.total);if(!bs.none&&S.budget.nudge&&bs.level==='red'){openModal({t:'over'});return}place()},
 place(){place()},
 close(){closeModal()},
 reset(){try{localStorage.removeItem(KEY)}catch(e){}S=seed();view={only:false};closeModal();go('home');render();toast('Demo data reset')}
};
document.addEventListener('click',ev=>{
 if(ev.target.id==='mroot'){closeModal();return}
 const el=ev.target.closest('[data-a]');if(!el)return;
 const f=A[el.dataset.a];if(f){ev.preventDefault();f({...el.dataset})}
},true);
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeModal();if(ev.key==='Enter'&&ev.target.id==='ba')A.b_save()});

/* ================= RENDER ================= */
function render(){
 const y=window.scrollY;header();
 document.title=route==='budget'?'Food budget | Swiggy':route==='cart'?'Cart | Swiggy':'Order food online from restaurants near you | Swiggy';
 $('app').innerHTML=route==='rest'?rest_(rid):route==='cart'?cart():route==='budget'?budget():home();
 window.scrollTo(0,y);if(modal)renderModal();
}
function boot(){
 parse();if(!location.hash)location.hash='#/home';
 if(q.demo==='cart'){S.cart={r:'r1',lines:{'r1-1':{q:1,note:'No onion, garlic'},'r1-2':{q:1,note:''},'r1-5':{q:2,note:''}}}}
 render();
 if(q.open==='rules')A.rules();
 if(q.open==='budget')A.budget();
 if(q.conf)openModal({t:'conf',id:q.conf});
}
boot();
</script>
</body>
</html>
