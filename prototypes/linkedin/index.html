<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feed | LinkedIn</title>
<style>
:root{
  --blue:#0a66c2; --blue-d:#004182; --blue-l:#70b5f9; --bg:#f4f2ee; --card:#fff;
  --t1:rgba(0,0,0,.9); --t2:rgba(0,0,0,.6); --line:#e0dfdc; --hover:#ebebeb; --green:#057642; --red:#cc1016; --amber:#915907;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--t1);font:14px/1.4 -apple-system,system-ui,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","Fira Sans",Ubuntu,Oxygen,"Oxygen Sans",Cantarell,"Droid Sans","Apple Color Emoji","Segoe UI Emoji","Segoe UI Emoji","Segoe UI Symbol","Lucida Grande",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none;cursor:pointer} a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.f{fill:currentColor;stroke:none}
svg.s{width:16px;height:16px}

/* header */
#hdr{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50}
.hd{max-width:1128px;margin:0 auto;height:52px;display:flex;align-items:center;gap:8px;padding:0 12px}
.logo{width:34px;height:34px;flex:none;display:block}
.srch{display:flex;align-items:center;gap:8px;background:#edf3f8;border-radius:4px;height:34px;width:280px;padding:0 10px;color:var(--t2);margin-left:2px}
.srch input{border:0;background:transparent;outline:0;font-size:14px;flex:1;min-width:0}
.nav{display:flex;margin-left:auto;align-items:stretch;height:52px}
.ni{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:80px;padding:0 6px;color:var(--t2);font-size:12px;border-bottom:2px solid transparent;position:relative;cursor:pointer;text-decoration:none;background:none;border-top:0;border-left:0;border-right:0}
.ni:hover{color:var(--t1);text-decoration:none}
.ni.on{color:var(--t1);border-bottom-color:var(--t1)}
.ni .bd{position:absolute;top:5px;left:calc(50% + 2px);background:#cc1016;color:#fff;border-radius:9px;min-width:16px;height:16px;font-size:11px;line-height:16px;text-align:center;padding:0 4px}
.ni.sep{border-left:1px solid var(--line);margin-left:6px;padding-left:12px}
.me{width:24px;height:24px;border-radius:50%}
.prem{color:#915907;font-size:12px;max-width:100px;line-height:1.2;text-decoration:underline;margin-left:8px;padding-left:12px;border-left:1px solid var(--line)}

/* layout */
.wrap{max-width:1128px;margin:24px auto 80px;display:grid;gap:24px;padding:0 12px}
.g3{grid-template-columns:225px minmax(0,540px) 300px}
.g2{grid-template-columns:225px minmax(0,1fr)}
.card{background:var(--card);border-radius:8px;box-shadow:0 0 0 1px rgba(140,140,140,.2);margin-bottom:8px;position:relative}
.pad{padding:12px 16px}
.card h2{font-size:16px;font-weight:600;margin:0}
.muted{color:var(--t2);font-size:12px}
.av{width:48px;height:48px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:17px;flex:none}
.av.sm{width:32px;height:32px;font-size:13px}
.btn{border-radius:24px;height:32px;padding:0 16px;font-weight:600;font-size:16px;border:1px solid transparent;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.p{background:var(--blue);color:#fff} .btn.p:hover{background:var(--blue-d)}
.btn.s{background:#fff;color:var(--blue);border-color:var(--blue)} .btn.s:hover{background:#edf3f8;box-shadow:inset 0 0 0 1px var(--blue)}
.btn.g{background:#fff;color:var(--t2);border-color:rgba(0,0,0,.4)} .btn.g:hover{background:var(--hover)}
.btn.sm{height:28px;font-size:14px;padding:0 12px}
.btn[disabled]{background:#e8e8e8;color:rgba(0,0,0,.4);border-color:transparent;cursor:not-allowed;box-shadow:none}
.new{background:#e7f3ec;color:var(--green);border-radius:4px;font-size:11px;font-weight:600;padding:1px 6px;margin-left:6px;vertical-align:middle}

/* left profile */
.ban{height:54px;border-radius:8px 8px 0 0;background:linear-gradient(120deg,#9db7c4,#6f93a8 55%,#b4c7d0)}
.pf{padding:0 12px 12px;text-align:center;border-bottom:1px solid var(--line)}
.pf .av{width:72px;height:72px;font-size:26px;margin:-36px auto 8px;border:2px solid #fff;background:#0a66c2}
.pf b{font-size:16px;display:block}
.stat{display:flex;justify-content:space-between;padding:4px 12px;font-size:12px;color:var(--t2);font-weight:600}
.stat span:last-child{color:var(--blue)}
.lk{display:flex;align-items:center;gap:8px;padding:10px 12px;font-weight:600;font-size:12px;color:var(--t1);cursor:pointer;border-top:1px solid var(--line)}
.lk:hover{background:var(--hover);text-decoration:none}

/* start post */
.sp{display:flex;gap:8px;align-items:center}
.sp .pill{flex:1;border:1px solid rgba(0,0,0,.45);border-radius:35px;height:48px;padding:0 16px;display:flex;align-items:center;color:var(--t2);font-weight:600;background:#fff;text-align:left}
.sp .pill:hover{background:var(--hover)}
.acts{display:flex;justify-content:space-around;margin-top:4px}
.acts button{background:none;border:0;display:flex;gap:6px;align-items:center;padding:10px 8px;border-radius:4px;color:var(--t2);font-weight:600}
.acts button:hover{background:var(--hover)}
.sort{display:flex;align-items:center;gap:8px;margin:6px 0 10px;color:var(--t2);font-size:12px}
.sort:before{content:"";flex:1;border-top:1px solid rgba(0,0,0,.15)} .sort b{color:var(--t1)}

/* post */
.ph{display:flex;gap:8px;padding:12px 16px 0;position:relative}
.ph .nm{font-weight:600;font-size:14px} .ph .nm:hover{color:var(--blue);text-decoration:underline;cursor:pointer}
.ph .hl{font-size:12px;color:var(--t2);line-height:1.3;max-width:340px}
.fl{margin-left:auto;color:var(--blue);font-weight:600;font-size:14px;background:none;border:0;display:flex;align-items:flex-start;gap:2px;height:24px;padding:2px 6px;border-radius:4px;margin-right:24px}
.fl:hover{background:#edf3f8}
.dots{position:absolute;right:8px;top:6px;background:none;border:0;border-radius:50%;width:32px;height:32px;color:var(--t2);display:flex;align-items:center;justify-content:center}
.dots:hover{background:var(--hover)}
.pb{padding:8px 16px;white-space:pre-line}
.pb .more{color:var(--t2);cursor:pointer}
.media{margin-top:4px;height:240px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:26px;text-align:center;padding:30px;line-height:1.25}
.cnt{display:flex;justify-content:space-between;padding:6px 16px;color:var(--t2);font-size:12px;border-bottom:1px solid var(--line)}
.pa{display:flex;justify-content:space-between;padding:4px 8px}
.pa button{background:none;border:0;flex:1;display:flex;align-items:center;justify-content:center;gap:6px;color:var(--t2);font-weight:600;padding:12px 4px;border-radius:4px}
.pa button:hover{background:var(--hover)}
.pa button.sv{color:var(--blue)}
.menu{position:absolute;right:8px;top:40px;width:300px;background:#fff;border-radius:8px;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 6px 14px rgba(0,0,0,.22);padding:8px 0;z-index:20}
.menu button{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;padding:8px 16px;color:var(--t1);font-weight:600}
.menu button small{display:block;font-weight:400;color:var(--t2);font-size:12px}
.menu button:hover{background:var(--hover)}
.menu .ic{margin-top:2px;color:var(--t2)}

/* right rail */
.news ul{margin:8px 0 0;padding:0;list-style:none}
.news li{padding:6px 0;cursor:pointer} .news li b{display:block;font-size:14px;font-weight:600} .news li:hover b{color:var(--blue)}
.news li:before{content:"\2022";margin-right:6px}
.foot{font-size:12px;color:var(--t2);text-align:center;padding:12px}
.foot a{color:var(--t2);margin:0 4px}

/* items sidebar */
.side .hd2{padding:12px 16px;font-size:16px;font-weight:600}
.si{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 16px;font-weight:600;font-size:14px;color:var(--t2);cursor:pointer;border-left:3px solid transparent;border-top:0;background:none;width:100%;text-align:left;border-right:0;border-bottom:0}
.si:hover{background:var(--hover)} .si.on{color:var(--green);border-left-color:var(--green);background:#f3f6f4}
.si .n{font-weight:400;font-size:12px}
.sec{padding:8px 16px 4px;font-size:12px;font-weight:600;color:var(--t2);text-transform:none;border-top:1px solid var(--line);margin-top:6px;display:flex;justify-content:space-between;align-items:center}
.sec a{font-size:12px}

/* saved */
.sh{display:flex;align-items:center;gap:12px;padding:16px 16px 8px;flex-wrap:wrap}
.sh h1{font-size:20px;margin:0;font-weight:600;flex:1;min-width:140px}
.sbar{display:flex;gap:8px;padding:0 16px 12px;align-items:center}
.sbar .srch{flex:1;width:auto;background:#edf3f8}
.item{display:flex;gap:12px;padding:16px;border-top:1px solid var(--line)}
.item .body{flex:1;min-width:0}
.item .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:6px 0}
.note{background:#f3f6f8;border-radius:6px;padding:8px 10px;font-size:13px;margin:6px 0}
.note b{font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{border:1px solid var(--line);background:#f9fafb;border-radius:14px;padding:1px 10px;font-size:12px;font-weight:600;color:var(--t2);display:inline-flex;align-items:center;gap:4px}
.row-a{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.lnk{background:none;border:0;color:var(--t2);font-weight:600;font-size:13px;padding:4px 8px;border-radius:4px;display:inline-flex;align-items:center;gap:4px}
.lnk:hover{background:var(--hover);color:var(--t1)}
.tomb{background:#fafafa;color:var(--t2)}
.empty{padding:48px 24px;text-align:center;color:var(--t2)}
.empty h3{color:var(--t1);margin:12px 0 4px;font-size:18px;font-weight:600}

/* jobs */
.job{display:flex;gap:12px;padding:16px;border-top:1px solid var(--line);align-items:flex-start}
.lg{width:56px;height:56px;border-radius:4px;color:#fff;font-weight:700;font-size:24px;display:flex;align-items:center;justify-content:center;flex:none}
.job h3{margin:0;font-size:16px;font-weight:600;color:var(--blue)} .job h3:hover{text-decoration:underline;cursor:pointer}
.job .co{font-size:14px} .job .meta{font-size:14px;color:var(--t2)}
.job .jf{font-size:12px;color:var(--t2);margin:4px 0 8px}
.job .ea{display:flex;gap:8px;align-items:center}
.jsave{background:none;border:0;color:var(--t2);padding:4px;border-radius:50%;margin-left:auto}
.jsave:hover{background:var(--hover)}

/* tracker */
.tabs{display:flex;border-bottom:1px solid var(--line);padding:0 16px}
.tabs div{padding:12px 12px;font-weight:600;color:var(--t2);border-bottom:2px solid transparent;cursor:pointer}
.tabs div.on{color:var(--green);border-bottom-color:var(--green)}
.nudge{background:#fff8e6;border:1px solid #f1d58b;border-radius:8px;padding:12px 16px;margin:12px 16px 0;display:flex;gap:12px;align-items:flex-start}
.nudge .ic{color:var(--amber);margin-top:2px}
.nudge ul{margin:6px 0 0;padding:0;list-style:none}
.nudge li{display:flex;align-items:center;gap:8px;padding:4px 0;flex-wrap:wrap}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:12px 16px 16px}
.col{background:#f3f2ef;border-radius:8px;padding:8px;min-height:260px}
.col.over{outline:2px dashed var(--blue);background:#edf3f8}
.col h4{margin:2px 4px 8px;font-size:13px;font-weight:600;display:flex;justify-content:space-between;color:var(--t1)}
.col h4 span{color:var(--t2);font-weight:400}
.ac{background:#fff;border-radius:8px;box-shadow:0 0 0 1px rgba(140,140,140,.3);padding:10px;margin-bottom:8px;cursor:grab}
.ac:active{cursor:grabbing}
.ac b{display:block;color:var(--blue);font-size:14px;font-weight:600;line-height:1.25}
.ac .co{font-size:12px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:10px;padding:1px 8px;margin-top:6px;margin-right:4px}
.tag.w{background:#fff1d6;color:var(--amber)} .tag.b{background:#e8f1fa;color:var(--blue-d)} .tag.r{background:#fbe9e9;color:var(--red)} .tag.g{background:#e7f3ec;color:var(--green)}
.ac .qa{display:flex;gap:4px;margin-top:6px}
.tl{margin:8px 0 0;padding:0 0 0 16px;border-left:2px solid var(--line);list-style:none}
.tl li{position:relative;padding:2px 0 8px 10px;font-size:13px}
.tl li:before{content:"";position:absolute;left:-22px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--blue);border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}

/* modal */
#mroot{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:flex-start;justify-content:center;padding-top:8vh;overflow:auto}
#mroot.on{display:flex}
.modal{background:#fff;border-radius:8px;width:min(560px,94vw);box-shadow:0 12px 28px rgba(0,0,0,.4);margin-bottom:40px}
.mh{display:flex;align-items:center;padding:12px 16px 12px 24px;border-bottom:1px solid var(--line)}
.mh h2{margin:0;flex:1;font-size:20px;font-weight:400}
.mx{background:none;border:0;width:40px;height:40px;border-radius:50%;color:var(--t2);display:flex;align-items:center;justify-content:center}
.mx:hover{background:var(--hover)}
.mb{padding:16px 24px;max-height:62vh;overflow:auto}
.mf{padding:12px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;align-items:center}
.fld{margin:0 0 14px} .fld label{display:block;font-size:14px;color:var(--t2);margin-bottom:4px}
.fld input,.fld textarea,.fld select{width:100%;border:1px solid rgba(0,0,0,.6);border-radius:4px;padding:8px 10px;font:inherit;color:var(--t1);background:#fff}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:0;box-shadow:inset 0 0 0 1px var(--blue);border-color:var(--blue)}
.fld textarea{min-height:90px;resize:vertical}
.err{color:var(--red);font-size:12px;margin-top:4px}
.crow{display:flex;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:16px}
.crow input{width:18px;height:18px;accent-color:var(--blue);flex:none}
.crow .n{margin-left:auto;font-size:12px;color:var(--t2)}
.addrow{display:flex;gap:8px;margin-top:14px}
.addrow input{flex:1;border:1px solid rgba(0,0,0,.6);border-radius:4px;padding:8px 10px;font:inherit}
.addrow input:focus{outline:0;border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue)}

/* toast */
#toast{position:fixed;left:24px;bottom:24px;background:#1d2226;color:#fff;border-radius:8px;padding:14px 16px;z-index:200;display:none;align-items:center;gap:16px;box-shadow:0 6px 18px rgba(0,0,0,.35);max-width:min(480px,90vw)}
#toast.on{display:flex}
#toast button{background:none;border:0;color:var(--blue-l);font-weight:600;font-size:14px;padding:0}
#toast button:hover{text-decoration:underline}
#demo{position:fixed;right:12px;bottom:10px;background:#1d2226;color:#fff;border-radius:16px;font-size:11px;padding:5px 12px;z-index:60;opacity:.92}
#demo a{color:var(--blue-l);margin-left:8px}
.bellmenu{position:absolute;right:130px;top:50px;width:360px;background:#fff;border-radius:8px;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 6px 14px rgba(0,0,0,.22);z-index:60}
.bellmenu .r{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
.bellmenu .r:hover{background:var(--hover)} .bellmenu .r.un{background:#edf3f8}
@media (max-width:960px){.g3,.g2{grid-template-columns:1fr}.g3>aside,.g2>aside{display:none}.nav .ni span{display:none}.ni{min-width:48px}.srch{width:160px}.prem{display:none}.board{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="hdr"></div>
<div id="app"></div>
<div id="mroot"></div>
<div id="toast"></div>
<div id="demo">Prototype for Tech Cohort 19 assignment · not affiliated with LinkedIn <a data-a="reset">Reset demo data</a></div>

<script>
/* ============ ICONS ============ */
const P={
 home:'<path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/>',
 net:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2c3 0 5 2 5 5.300"/>',
 jobs:'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2M3 13h18"/>',
 msg:'<path d="M4 5h16a1 1 0 011 1v10a1 1 0 01-1 1h-9l-5 4v-4H4a1 1 0 01-1-1V6a1 1 0 011-1z"/>',
 bell:'<path d="M6 17v-6a6 6 0 1112 0v6l2 2H4zM10 21h4"/>',
 search:'<circle cx="11" cy="11" r="6.500"/><path d="M16 16l5 5"/>',
 like:'<path d="M7 11v9H3.500v-9zM7 11l4-7c1.600 0 2.600 1.100 2.300 2.600L12.600 10H19a2 2 0 012 2.300l-1.200 6.500A2 2 0 0117.800 20H7"/>',
 comment:'<path d="M4 5h16v11H9l-5 4z"/>',
 repost:'<path d="M4 11V9a3 3 0 013-3h11l-3-3M20 13v2a3 3 0 01-3 3H6l3 3"/>',
 send:'<path d="M3 11l18-8-8 18-2-8z"/>',
 bm:'<path d="M6 3h12v18l-6-4-6 4z"/>',
 dots:'<circle cx="5" cy="12" r="1.600" class="x"/><circle cx="12" cy="12" r="1.600"/><circle cx="19" cy="12" r="1.600"/>',
 globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><ellipse cx="12" cy="12" rx="4" ry="9"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 x:'<path d="M6 6l12 12M18 6L6 18"/>',
 check:'<path d="M5 12.500l4.500 4.500L19 7"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
 trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
 pen:'<path d="M4 20l1-5L16 4l4 4L9 19z"/>',
 link:'<path d="M10 14a4 4 0 005.700 0l3-3a4 4 0 00-5.700-5.700l-1 1M14 10a4 4 0 00-5.700 0l-3 3a4 4 0 005.700 5.700l1-1"/>',
 flag:'<path d="M5 21V4M5 4h13l-2 4 2 4H5"/>',
 folder:'<path d="M3 6h7l2 2h9v11H3z"/>',
 eyeoff:'<path d="M3 3l18 18M10 6.200A9 9 0 0121 12a13 13 0 01-3 3.800M6.500 7.500A13 13 0 003 12s3.500 6 9 6c1.500 0 2.800-.4 4-1"/>',
 media:'<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="1.500"/><path d="M3 17l5-4 4 3 3-2 6 4"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 doc:'<path d="M6 3h9l4 4v14H6zM14 3v5h5M9 13h7M9 17h7"/>'
};
const I=(n,c='')=>`<svg class="i ${c}" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const IF=(n)=>`<svg class="i" viewBox="0 0 24 24" style="fill:currentColor"><path d="M6 3h12v18l-6-4-6 4z"/></svg>`;

/* ============ DATA ============ */
const COLORS=['#7a5c99','#b24020','#0073b1','#5f6b3e','#9b3a62','#287a7a','#a05a00','#44576e'];
const colorOf=s=>COLORS[[...s].reduce((a,c)=>a+c.charCodeAt(0),0)%COLORS.length];
const ini=s=>s.split(' ').map(w=>w[0]).slice(0,2).join('');
const ME={name:'Manish Verma',hl:'Aspiring Tech PM | Tech Cohort 19 @ HelloPM'};
const POSTS=[
 {id:'p1',by:'Aarav Mehta',hl:'Group Product Manager at Zenith Pay',t:'2h',txt:'We shipped a "pay later" flow in 6 weeks and then rolled it back in 2.\n\nThree lessons from a failed experiment:\n1. Measure repeat usage, not first-click conversion.\n2. Ship the support playbook with the feature, not after it.\n3. A rollback plan is a product requirement.\n\nWhat would you add to this list?',media:{bg:'linear-gradient(135deg,#0a66c2,#2b3a67)',t:'3 lessons from a feature we rolled back'},likes:1842,cm:96,rp:41},

function myjobs(){
 const ns=nudges();
 return `<div class="wrap g2">${myItemsSide('jobs')}<main><div class="card">
  <div class="sh" style="padding-bottom:0"><h1>My jobs <span class="new">New</span></h1><span class="muted">Drag cards between columns, or open a card to move it</span></div>
  <div class="tabs"><div>Saved <span class="muted">${S.savedJobs.length}</span></div><div class="on">Application tracker <span class="muted">${S.apps.length}</span></div><div>Archived</div></div>
  ${ns.length?`<div class="nudge"><span class="ic">${I('clock')}</span><div style="flex:1"><b>${ns.length} application${ns.length>1?'s':''} may need a follow-up</b><div class="muted">Following up within a week of applying is a good time to show continued interest.</div><ul>
   ${ns.map(a=>{const j=job(a.jobId);return `<li><span style="font-weight:600">${j.title}</span> · ${j.co} <span class="muted">· ${esc(nudgeOf(a).why)}</span><span style="margin-left:auto;display:flex;gap:6px"><button class="btn s sm" data-a="opendraft" data-id="${a.id}">Draft follow-up</button><button class="btn g sm" data-a="snooze" data-id="${a.id}">Snooze</button></span></li>`}).join('')}</ul></div></div>`:''}
  <div class="board">${STAGES.map(s=>`<div class="col" data-stage="${s}"><h4>${s}<span>${S.apps.filter(a=>a.stage===s).length}</span></h4>${S.apps.filter(a=>a.stage===s).sort((a,b)=>new Date(last(b))-new Date(last(a))).map(appCard).join('')||'<div class="muted" style="padding:8px;text-align:center">No applications</div>'}</div>`).join('')}</div>
  <div class="pad muted" style="border-top:1px solid var(--line)">Nudge me after <select id="nd" style="border:1px solid var(--line);border-radius:4px;padding:2px 4px">${[3,7,14].map(n=>`<option ${S.nudgeDays===n?'selected':''}>${n}</option>`).join('')}</select> days without an update</div>
 </div></main></div>`;
}

/* ============ MODALS ============ */
function openModal(m){modal=m;renderModal()}
function closeModal(){modal=null;$('mroot').classList.remove('on');$('mroot').innerHTML=''}
function shell(title,body,foot){return `<div class="modal" role="dialog" aria-label="${esc(title)}"><div class="mh"><h2>${title}</h2><button class="mx" data-a="close" aria-label="Dismiss">${I('x')}</button></div><div class="mb">${body}</div>${foot?`<div class="mf">${foot}</div>`:''}</div>`}
function renderModal(){
 if(!modal)return closeModal();
 let h='';const m=modal;
 if(m.type==='collect'){
  const s=svd(m.id)||{collections:[],note:''}, p=post(m.id);
  h=shell('Save to collection',`<div class="muted" style="margin-bottom:8px">${p.by}: ${esc(p.txt.slice(0,70))}…</div>
   ${S.collections.map(c=>`<label class="crow"><input type="checkbox" data-a="tog" data-id="${c.id}" ${s.collections.includes(c.id)?'checked':''}>${I('folder','s')}<span>${esc(c.name)}</span><span class="n">${colCount(c.id)} posts</span></label>`).join('')||'<div class="muted" style="padding:8px 0">You have no collections yet. Create your first one below.</div>'}
   <div class="addrow"><input id="ncn" maxlength="60" placeholder="New collection name (max 40 characters)"><button class="btn s sm" data-a="addcol">Create</button></div><div class="err" id="cerr">${m.err||''}</div>
   <div class="fld" style="margin-top:14px"><label>Private note <span class="muted">(only you can see this · <span id="nc">${s.note.length}</span>/280)</span></label><textarea id="pn" maxlength="280" placeholder="Why did you save this?">${esc(s.note)}</textarea></div>`,
   `<span class="muted" style="margin-right:auto">${s.collections.length?s.collections.length+' selected':'Will be kept in Unsorted'}</span><button class="btn p" data-a="close">Done</button>`);
 }else if(m.type==='newcol'||m.type==='rename'){
  const c=m.type==='rename'?S.collections.find(x=>x.id===m.id):null;
  h=shell(c?'Rename collection':'New collection',`<div class="fld"><label>Collection name</label><input id="cn" maxlength="60" value="${c?esc(c.name):''}" placeholder="e.g. Interview prep"><div class="err">${m.err||''}</div></div><div class="muted">${S.collections.length} of ${MAXCOL} collections used. Names must be unique.</div>`,
   `<button class="btn g" data-a="close">Cancel</button><button class="btn p" data-a="${c?'dorename':'donew'}" data-id="${c?c.id:''}">${c?'Save':'Create'}</button>`);
 }else if(m.type==='delcol'){
  const c=S.collections.find(x=>x.id===m.id);
  h=shell('Delete collection?',`<b>${esc(c.name)}</b> has ${colCount(c.id)} saved posts.<div class="muted" style="margin-top:8px;font-size:14px">Posts are not deleted. They stay in Saved posts and move to <b>Unsorted</b> unless they are in another collection.</div>`,
   `<button class="btn g" data-a="close">Cancel</button><button class="btn p" style="background:var(--red)" data-a="dodel" data-id="${c.id}">Delete collection</button>`);
 }else if(m.type==='apply'){
  const j=job(m.id);
  h=shell('Apply to '+esc(j.co),`<div style="display:flex;gap:12px;margin-bottom:12px"><div class="lg" style="background:${colorOf(j.co)}">${j.co[0]}</div><div><b style="font-size:16px">${j.title}</b><div>${j.co} · ${j.loc}</div></div></div>
   <div class="fld"><label>Email address</label><input value="manish.verma@example.com" readonly></div><div class="fld"><label>Mobile phone number</label><input value="+91 98765 43210" readonly></div>
   <div class="fld"><label>Resume</label><div style="border:1px solid var(--line);border-radius:4px;padding:10px;display:flex;gap:8px;align-items:center">${I('doc')}<span>Manish_Verma_Resume.pdf</span></div></div>
   <div class="muted" style="background:#e8f1fa;border-radius:6px;padding:8px 10px;color:var(--blue-d)">${I('clock','s')} This application will be tracked automatically in <b>My jobs</b>, and we will remind you to follow up.</div>`,
   `<button class="btn p" data-a="submitapp" data-id="${j.id}">Submit application</button>`);
 }else if(m.type==='app'){
  const a=appOf(m.id), j=job(a.jobId), n=nudgeOf(a);
  h=shell(esc(j.title),`<div class="muted" style="margin:-4px 0 12px;font-size:14px">${j.co} · ${j.loc}</div>
   ${n?`<div class="nudge" style="margin:0 0 14px"><span class="ic">${I('clock')}</span><div><b>${esc(n.why)}</b><div class="muted">Recruiter: ${j.rec}</div><div style="margin-top:6px"><button class="btn s sm" data-a="opendraft" data-id="${a.id}">Draft follow-up</button></div></div></div>`:''}
   <div class="fld"><label>Stage</label><select id="st">${STAGES.map(s=>`<option ${a.stage===s?'selected':''}>${s}</option>`).join('')}</select></div>
   <div class="fld"><label>Follow-up reminder</label><input type="date" id="rm" min="${todayStr()}" value="${a.reminder||''}"><div class="err">${m.err||''}</div><div class="muted" style="margin-top:4px">Suggested: <a data-a="sug">${fmt(Date.now()+7*day)} (in 7 days)</a></div></div>
   <div class="fld"><label>Private note <span class="muted">(max 500)</span></label><textarea id="an" maxlength="500">${esc(a.note)}</textarea></div>
   <b>Timeline</b><ul class="tl">${[...a.history].reverse().map(h=>`<li><b>${h.stage}</b> <span class="muted">${fmt(h.at)}</span></li>`).join('')}${a.closedReason?`<li class="muted">${esc(a.closedReason)}</li>`:''}</ul>`,
   `<button class="btn g" data-a="close">Cancel</button><button class="btn p" data-a="saveapp" data-id="${a.id}">Save changes</button>`);
 }else if(m.type==='draft'){
  const a=appOf(m.id), j=job(a.jobId);
  const txt=m.txt??`Hi ${j.rec.split(' ')[0]},\n\nI applied for the ${j.title} role at ${j.co} on ${fmt(a.history[0].at)} and wanted to share my continued interest in the team.\n\nI would be glad to share more about my background or answer any questions. Could you let me know if there is an update on the process?\n\nThank you for your time,\n${ME.name.split(' ')[0]}`;
  h=shell('Follow up with '+esc(j.rec),`<div style="display:flex;gap:10px;align-items:center;margin-bottom:12px"><div class="av" style="background:${colorOf(j.rec)}">${ini(j.rec)}</div><div><b>${j.rec}</b><div class="muted">Recruiter · ${j.co}</div></div></div>
   <div class="fld"><label>Message (edit before sending)</label><textarea id="dt" style="min-height:190px">${esc(txt)}</textarea></div><div class="muted">${I('check','s')} Drafts are suggestions only. Nothing is sent until you press Send.</div>`,
   `<button class="btn g" data-a="copy">Copy text</button><button class="btn p" data-a="sendmsg" data-id="${a.id}">${I('send','s')}Send message</button>`);
 }
 const r=$('mroot');r.innerHTML=h;r.classList.add('on');
}

/* ============ TOAST ============ */
let tt;function toast(msg,act,fn){const t=$('toast');t.innerHTML=`<span>${msg}</span>${act?`<button id="tact">${act}</button>`:''}<button data-a="tclose" style="color:#fff">${I('x','s')}</button>`;t.classList.add('on');if(act)$('tact').onclick=()=>{t.classList.remove('on');fn()};clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),6500)}

/* ============ ACTIONS ============ */
function nameErr(name,exceptId){
 name=name.trim();if(!name)return 'Enter a collection name.';if(name.length>40)return 'Names can be up to 40 characters.';
 if(S.collections.some(c=>c.id!==exceptId&&c.name.toLowerCase()===name.toLowerCase()))return 'You already have a collection with this name.';
 if(!exceptId&&S.collections.length>=MAXCOL)return 'You have reached the limit of '+MAXCOL+' collections.';return '';
}
function moveApp(a,stage,silent){
 if(a.stage===stage)return;const prev=a.stage;a.stage=stage;a.history.push({stage,at:new Date().toISOString()});a.snoozed=false;if(stage!=='Closed')delete a.closedReason;save();render();
 if(!silent)toast(`Moved to <b>${stage}</b>`,'Undo',()=>{a.history.pop();a.stage=prev;save();render()});
}
const A={
 menu(e){menu=menu===e.id?null:e.id;render(true)},
 save(e){if(!svd(e.id)){S.saved.push({postId:e.id,collections:[],note:'',at:new Date().toISOString()});save()}menu=null;render(true);toast('Post saved','Add to collection',()=>openModal({type:'collect',id:e.id}))},
 unsave(e){const s=svd(e.id);S.saved=S.saved.filter(x=>x.postId!==e.id);save();menu=null;render(true);toast('Removed from saved posts','Undo',()=>{S.saved.push(s);save();render(true)})},
 collect(e){menu=null;render(true);openModal({type:'collect',id:e.id})},
 tog(e){const s=svd(modal.id);if(!s)return;const i=s.collections.indexOf(e.id);i<0?s.collections.push(e.id):s.collections.splice(i,1);save();const sc=$('mroot').scrollTop;renderModal();$('mroot').scrollTop=sc;render(true)},
 addcol(){const n=$('ncn').value;const er=nameErr(n);if(er){$('cerr').textContent=er;return}const id='c'+Date.now();S.collections.push({id,name:n.trim()});const s=svd(modal.id);if(s)s.collections.push(id);save();renderModal();render(true)},
 newcol(){openModal({type:'newcol'})},
 donew(){const n=$('cn').value,er=nameErr(n);if(er){modal.err=er;renderModal();$('cn').value=n;return}S.collections.push({id:'c'+Date.now(),name:n.trim()});save();closeModal();render(true);toast('Collection created')},
 rename(e){openModal({type:'rename',id:e.id})},
 dorename(e){const n=$('cn').value,er=nameErr(n,e.id);if(er){modal.err=er;renderModal();$('cn').value=n;return}S.collections.find(c=>c.id===e.id).name=n.trim();save();closeModal();render(true)},
 delcol(e){openModal({type:'delcol',id:e.id})},
 dodel(e){S.collections=S.collections.filter(c=>c.id!==e.id);S.saved.forEach(s=>s.collections=s.collections.filter(x=>x!==e.id));view.col='all';save();closeModal();render(true);toast('Collection deleted. Posts moved to Unsorted')},
 col(e){view.col=e.id;view.q='';render(true)},
 nav(e){go(e.r)},
 savejob(e){const i=S.savedJobs.indexOf(e.id);i<0?S.savedJobs.push(e.id):S.savedJobs.splice(i,1);save();render(true);toast(i<0?'Job saved':'Job removed from saved')},
 apply(e){openModal({type:'apply',id:e.id})},
 submitapp(e){if(S.apps.some(a=>a.jobId===e.id)){closeModal();toast('You have already applied to this job');return}
  S.apps.push({id:'a'+Date.now(),jobId:e.id,stage:'Applied',reminder:'',note:'',history:[{stage:'Applied',at:new Date().toISOString()}]});save();closeModal();render(true);toast('Application sent to '+job(e.id).co,'View tracker',()=>go('myjobs'))},
 openapp(e){openModal({type:'app',id:e.id})},
 sug(){$('rm').value=new Date(Date.now()+7*day).toISOString().slice(0,10)},
 saveapp(e){const a=appOf(e.id),rm=$('rm').value;if(rm&&rm<todayStr()){modal.err='Pick today or a future date.';const st=$('st').value,an=$('an').value;renderModal();$('st').value=st;$('an').value=an;$('rm').value=rm;return}
  a.reminder=rm;a.note=$('an').value;a.snoozed=false;const st=$('st').value;save();closeModal();if(st!==a.stage)moveApp(a,st);else{render(true);toast('Application updated')}},
 opendraft(e){bell=false;header();if(route!=='myjobs')go('myjobs');openModal({type:'draft',id:e.id})},
 snooze(e){const a=appOf(e.id);a.snoozed=true;if(a.reminder&&a.reminder<=todayStr())a.reminder='';save();render(true);toast('Snoozed. We will not remind you again for this application')},
 copy(){const t=$('dt');t.select();try{navigator.clipboard.writeText(t.value)}catch(e){document.execCommand('copy')}toast('Message copied to clipboard')},
 sendmsg(e){const a=appOf(e.id),j=job(a.jobId);a.snoozed=true;a.reminder='';a.history.push({stage:a.stage,at:new Date().toISOString()});a.history[a.history.length-1].stage=a.stage+' · follow-up sent';save();closeModal();render(true);toast('Message sent to '+esc(j.rec))},
 close(){closeModal()},bell(){bell=!bell;header()},tclose(){$('toast').classList.remove('on')},
 reset(){try{localStorage.removeItem(KEY)}catch(e){}S=seed();view={col:'all',q:''};closeModal();render(true);toast('Demo data reset')}
};
document.addEventListener('click',ev=>{
 if(ev.target.id==='mroot'){closeModal();return}
 const el=ev.target.closest('[data-a]');
 if(menu&&!ev.target.closest('.menu')&&!(el&&el.dataset.a==='menu')){menu=null;render(true)}
 if(bell&&!ev.target.closest('.bellmenu')&&!(el&&el.dataset.a==='bell')){bell=false;header()}
 if(!el)return;
 if(el.dataset.a==='openapp'&&ev.target.closest('button'))return;
 const f=A[el.dataset.a];if(f){ev.preventDefault();ev.stopPropagation();f({...el.dataset})}
},true);
document.addEventListener('input',ev=>{
 if(ev.target.id==='sq'){view.q=ev.target.value;savedList()}
 if(ev.target.id==='pn'&&modal&&modal.type==='collect'){const s=svd(modal.id);if(s){s.note=ev.target.value;save();$('nc').textContent=ev.target.value.length;render(true)}}
});
document.addEventListener('change',ev=>{if(ev.target.id==='nd'){S.nudgeDays=+ev.target.value;save();render(true)}});
document.addEventListener('keydown',ev=>{
 if(ev.key==='Escape'){closeModal();menu=null;render(true)}
 if(ev.key==='Enter'&&ev.target.id==='ncn')A.addcol();
 if(ev.key==='Enter'&&ev.target.id==='cn')document.querySelector('.mf .p').click();
});
/* drag & drop */
let dragId=null;
document.addEventListener('dragstart',ev=>{const c=ev.target.closest&&ev.target.closest('.ac');if(c){dragId=c.dataset.id;ev.dataTransfer.setData('text/plain',dragId);ev.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',ev=>{const c=ev.target.closest&&ev.target.closest('.col');if(c&&dragId){ev.preventDefault();document.querySelectorAll('.col.over').forEach(x=>x.classList.remove('over'));c.classList.add('over')}});
document.addEventListener('drop',ev=>{const c=ev.target.closest&&ev.target.closest('.col');if(c&&dragId){ev.preventDefault();const a=appOf(dragId);dragId=null;moveApp(a,c.dataset.stage)}});
document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.col.over').forEach(x=>x.classList.remove('over'))});

/* ============ RENDER ============ */
function render(keep){
 const y=window.scrollY;
 document.title=(route==='saved'?'Saved posts':route==='jobs'?'Jobs':route==='myjobs'?'My jobs':'Feed')+' | LinkedIn';
 header();
 $('app').innerHTML=route==='saved'?saved():route==='jobs'?jobs():route==='myjobs'?myjobs():feed();
 if(route==='saved')savedList();
 if(keep)window.scrollTo(0,y);
 if(modal)renderModal();
}
function boot(){
 parse();if(!location.hash)location.hash='#/feed';render();
 // deep links used for screenshots / reviewers:  #/feed?open=collect  #/myjobs?open=a2  #/myjobs?draft=a2
 if(q.open==='collect'){const s=svd('p1')||(S.saved.push({postId:'p1',collections:['c1'],note:'',at:new Date().toISOString()}),S.saved.at(-1));render();openModal({type:'collect',id:'p1'})}
 if(q.menu){menu=q.menu;render()}
 if(q.open&&q.open[0]==='a')openModal({type:'app',id:q.open});
 if(q.draft)openModal({type:'draft',id:q.draft});
 if(q.apply)openModal({type:'apply',id:q.apply});
 if(q.col){view.col=q.col;render()}
 if(q.q){view.q=q.q;render()}
 if(q.bell){bell=true;header()}
}
boot();
</script>
</body>
</html>
